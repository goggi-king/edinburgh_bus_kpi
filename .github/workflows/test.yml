name: Test Supabase
 
on:
  workflow_dispatch:
 
jobs:
 
  test:
 
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Get the code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install Supabase
        run: pip install supabase
 
      - name: Run test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python test.py
